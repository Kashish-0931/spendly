{% extends "base.html" %}

{% block title %}Add an expense — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add an expense</h1>
            <p class="auth-subtitle">Track every rupee you spend</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="250.00"
                           step="0.01" min="0.01"
                           value="{{ form.amount or '' }}"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {{ 'selected' if not form.category else '' }}>Choose a category</option>
                        {% for category in categories %}
                        <option value="{{ category }}" {{ 'selected' if form.category == category else '' }}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ form.date or today }}"
                           max="{{ today }}"
                           required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="Optional note"
                           maxlength="200"
                           value="{{ form.description or '' }}">
                </div>
                <button type="submit" class="btn-submit">Add expense</button>
            </form>
        </div>

    </div>
</section>

{% endblock %}
